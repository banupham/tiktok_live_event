name: Build avatar portable packages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-avatar-portables.yml'
      - 'build/**'
      - 'BUILD_TRIGGER.txt'

permissions:
  contents: read

env:
  SOURCE_REPO: banupham/tiktok_live_cmd_active_viewers_v9
  SOURCE_REF: simplify-windows-linux-termux
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate source and build Linux x64
        shell: bash
        run: |
          set -euxo pipefail
          node source/scripts/check.mjs
          node source/scripts/smoke_test.mjs
          python -m py_compile source/scripts/direct_webcast_collector.py
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-direct.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile \
            --name tiktok-direct-collector \
            --collect-all TikTokLive \
            --collect-all TikTokLiveProto \
            source/scripts/direct_webcast_collector.py
          ./dist/tiktok-direct-collector --help >/dev/null
          mkdir -p bundle/app bundle/runtime
          cp source/a.mjs bundle/app/a.mjs
          cp -R source/src bundle/app/src
          python build/patch_portable.py bundle
          cp -L "$(command -v node)" bundle/runtime/node
          cp dist/tiktok-direct-collector bundle/runtime/tiktok-direct-collector
          cat > bundle/run.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          if [ "$#" -lt 1 ]; then
            echo "Cach dung: ./run.sh ten_tiktok [api_port]"
            exit 1
          fi
          USERNAME=$1
          if [ "${2:-}" != "" ]; then export API_PORT=$2; fi
          : "${API_PORT:=8787}"
          export API_PORT COLLECTOR_MODE=direct
          export DIRECT_COLLECTOR_BIN="$ROOT/runtime/tiktok-direct-collector"
          exec "$ROOT/runtime/node" "$ROOT/app/a.mjs" "$USERNAME"
          EOF
          chmod +x bundle/run.sh bundle/runtime/node bundle/runtime/tiktok-direct-collector
          cat > bundle/README.txt <<'EOF'
          LINUX X64 PORTABLE
          - Khong can cai Node.js, Python, npm package hay pip package.
          - Direct Webcast mode.
          - Co event avatar: tai anh mot lan/user vao thu muc temp, khong lap theo comment/join/like/gift.
          - Chay: ./run.sh ten_tiktok [api_port]
          EOF
          bundle/runtime/node --check bundle/app/a.mjs
          tar -C bundle -czf tiktok-live-event-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-x64-avatar
          path: tiktok-live-event-linux-x64.tar.gz
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build Linux ARM64
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "aarch64"
          python -m py_compile source/scripts/direct_webcast_collector.py
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-direct.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile \
            --name tiktok-direct-collector \
            --collect-all TikTokLive \
            --collect-all TikTokLiveProto \
            source/scripts/direct_webcast_collector.py
          ./dist/tiktok-direct-collector --help >/dev/null
          mkdir -p bundle/app bundle/runtime
          cp source/a.mjs bundle/app/a.mjs
          cp -R source/src bundle/app/src
          python build/patch_portable.py bundle
          cp -L "$(command -v node)" bundle/runtime/node
          cp dist/tiktok-direct-collector bundle/runtime/tiktok-direct-collector
          cat > bundle/run.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          if [ "$#" -lt 1 ]; then
            echo "Cach dung: ./run.sh ten_tiktok [api_port]"
            exit 1
          fi
          USERNAME=$1
          if [ "${2:-}" != "" ]; then export API_PORT=$2; fi
          : "${API_PORT:=8787}"
          export API_PORT COLLECTOR_MODE=direct
          export DIRECT_COLLECTOR_BIN="$ROOT/runtime/tiktok-direct-collector"
          exec "$ROOT/runtime/node" "$ROOT/app/a.mjs" "$USERNAME"
          EOF
          chmod +x bundle/run.sh bundle/runtime/node bundle/runtime/tiktok-direct-collector
          cat > bundle/README.txt <<'EOF'
          LINUX ARM64 PORTABLE
          - Khong can cai Node.js, Python, npm package hay pip package.
          - Direct Webcast mode.
          - Co event avatar: tai anh mot lan/user vao thu muc temp, khong lap theo comment/join/like/gift.
          - Chay: ./run.sh ten_tiktok [api_port]
          EOF
          bundle/runtime/node --check bundle/app/a.mjs
          tar -C bundle -czf tiktok-live-event-linux-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-arm64-avatar
          path: tiktok-live-event-linux-arm64.tar.gz
          if-no-files-found: error

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build Windows x64
        shell: pwsh
        run: |
          python -m py_compile source/scripts/direct_webcast_collector.py
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-direct.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile `
            --name tiktok-direct-collector `
            --collect-all TikTokLive `
            --collect-all TikTokLiveProto `
            source/scripts/direct_webcast_collector.py
          .\dist\tiktok-direct-collector.exe --help | Out-Null
          New-Item -ItemType Directory -Force bundle/app, bundle/runtime | Out-Null
          Copy-Item source/a.mjs bundle/app/a.mjs
          Copy-Item source/src bundle/app/src -Recurse
          python build/patch_portable.py bundle
          Copy-Item (Get-Command node).Source bundle/runtime/node.exe
          Copy-Item dist/tiktok-direct-collector.exe bundle/runtime/tiktok-direct-collector.exe
          @'
          @echo off
          chcp 65001 >nul
          setlocal
          cd /d "%~dp0"
          if "%~1"=="" (
            echo Cach dung: run.bat ten_tiktok [api_port]
            exit /b 1
          )
          if not "%~2"=="" set "API_PORT=%~2"
          if not defined API_PORT set "API_PORT=8787"
          set "COLLECTOR_MODE=direct"
          set "DIRECT_COLLECTOR_BIN=%~dp0runtime\tiktok-direct-collector.exe"
          "%~dp0runtime\node.exe" "%~dp0app\a.mjs" "%~1"
          exit /b %ERRORLEVEL%
          '@ | Set-Content -Encoding ASCII bundle/run.bat
          @'
          WINDOWS X64 PORTABLE
          - Khong can cai Node.js, Python, npm package hay pip package.
          - Direct Webcast mode.
          - Co event avatar: tai anh mot lan/user vao thu muc temp, khong lap theo comment/join/like/gift.
          - Chay: run.bat ten_tiktok [api_port]
          '@ | Set-Content -Encoding UTF8 bundle/README.txt
          .\bundle\runtime\node.exe --check .\bundle\app\a.mjs
          Compress-Archive -Path bundle\* -DestinationPath tiktok-live-event-windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64-avatar
          path: tiktok-live-event-windows-x64.zip
          if-no-files-found: error
