name: Build Termux portable and publish

on:
  pull_request:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/termux-portable.yml'

permissions:
  actions: read
  contents: write

env:
  SOURCE_REPO: banupham/tiktok_live_cmd_active_viewers_v9
  SOURCE_REF: simplify-windows-linux-termux
  DESKTOP_RUN_ID: '32565642557'
  PYDANTIC_CORE_VERSION: '2.46.4'

jobs:
  termux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build Android pydantic-core and assemble Termux bundle
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.13.3,<2'
          rustup target add aarch64-linux-android

          # Use Termux's own current Python package as the cross-link target.
          BASE_URL='https://packages.termux.dev/apt/termux-main/pool/main/p/python'
          FNAME=$(curl -fsSL "$BASE_URL/" | grep -oP '(?<=href=")python_[^"]+_aarch64\.deb' | head -n 1)
          test -n "$FNAME"
          curl -fL "$BASE_URL/$FNAME" -o termux-python.deb
          mkdir -p termux-python
          dpkg-deb -x termux-python.deb termux-python

          TERMUX_PREFIX="$PWD/termux-python/data/data/com.termux/files/usr"
          TERMUX_PYVER=$(find "$TERMUX_PREFIX/lib" -maxdepth 1 -type d -name 'python3.*' -printf '%f\n' | sed 's/^python//' | sort -V | tail -n 1)
          test -n "$TERMUX_PYVER"
          echo "Termux Python target: $TERMUX_PYVER"

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_LIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24"
          mkdir -p "$NDK_LIB"
          cp -a "$TERMUX_PREFIX"/lib/libpython* "$NDK_LIB/"

          python -m pip download "pydantic_core==$PYDANTIC_CORE_VERSION" --no-binary=:all: --no-deps -d core-src
          mkdir -p core-build android-wheels
          tar -xf core-src/pydantic_core-*.tar.gz -C core-build --strip-components=1

          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          export PYO3_CROSS_LIB_DIR="$TERMUX_PREFIX/lib"
          export PYO3_CROSS_PYTHON_VERSION="$TERMUX_PYVER"

          (cd core-build && maturin build --release --strip --manylinux off --target aarch64-linux-android --out ../android-wheels)
          ls -lah android-wheels

          mkdir -p bundle/app bundle/app/scripts bundle/vendor wheel-unpack
          # Install all Python packages as importable files, then replace native Linux
          # extensions with the Android/Termux build where required.
          python -m pip install -r source/requirements-direct.txt --target bundle/vendor
          find bundle/vendor -type f \( -name '*.so' -o -name '*.pyc' \) -delete
          find bundle/vendor -type d -name '__pycache__' -prune -exec rm -rf {} + || true

          python -m zipfile -e "$(find android-wheels -name 'pydantic_core-*.whl' | head -n 1)" wheel-unpack
          rm -rf bundle/vendor/pydantic_core
          cp -a wheel-unpack/pydantic_core bundle/vendor/pydantic_core

          CORE_SO=$(find bundle/vendor/pydantic_core -name '_pydantic_core*.so' | head -n 1)
          test -n "$CORE_SO"
          file "$CORE_SO"
          readelf -h "$CORE_SO" | grep -E 'Class:|Machine:'
          if ! file "$CORE_SO" | grep -q 'ARM aarch64'; then
            echo 'pydantic-core không phải Android ARM64' >&2
            exit 20
          fi

          cp source/a.mjs bundle/app/a.mjs
          cp -R source/src bundle/app/src
          cp source/scripts/direct_webcast_collector.py bundle/app/scripts/direct_webcast_collector.py

          cat > bundle/run.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

          if ! command -v node >/dev/null 2>&1; then
            echo '[THIEU NODE] Gói này không cần npm install, nhưng Termux phải có runtime node.' >&2
            echo 'Cần lệnh node có sẵn trong Termux.' >&2
            exit 10
          fi
          if ! command -v python >/dev/null 2>&1; then
            echo '[THIEU PYTHON] Gói này không cần pip install, nhưng Termux phải có runtime python.' >&2
            echo 'Cần lệnh python có sẵn trong Termux.' >&2
            exit 11
          fi
          python - <<'PY'
          import sys
          if sys.version_info < (3, 14):
              raise SystemExit('Cần Python Termux 3.14+ để dùng native pydantic-core đã đóng gói.')
          PY

          if [ "$#" -lt 1 ]; then
            echo 'Cach dung: ./run.sh ten_tiktok [api_port]'
            exit 1
          fi

          USERNAME=$1
          if [ "${2:-}" != "" ]; then export API_PORT=$2; fi
          : "${API_PORT:=8787}"
          export API_PORT COLLECTOR_MODE=direct PYTHON_BIN=python
          export PYTHONPATH="$ROOT/vendor${PYTHONPATH:+:$PYTHONPATH}"
          export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
          exec node "$ROOT/app/a.mjs" "$USERNAME"
          EOF
          chmod +x bundle/run.sh

          cat > bundle/README.txt <<EOF
          TERMUX ARM64 - KHONG CAN npm install / pip install
          ==================================================
          Da dong goi san TikTokLive va cac Python dependencies, gom ca pydantic-core native cho Android ARM64.

          Yeu cau nen: Termux co san lenh node va python (Python $TERMUX_PYVER target).
          Khong dung file Linux ARM64 cho Termux vi Android dung Bionic.

          Chay:
            ./run.sh ten_tiktok
            ./run.sh ten_tiktok 8788
          EOF

          tar -C bundle -czf tiktok-live-event-termux-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: portable-termux-arm64
          path: tiktok-live-event-termux-arm64.tar.gz
          if-no-files-found: error

  publish:
    needs: termux-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main for publishing
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download successful Windows/Linux artifacts from verified build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.DESKTOP_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: portable-*
          path: downloads
          merge-multiple: true

      - name: Download Termux artifact from this run
        uses: actions/download-artifact@v4
        with:
          name: portable-termux-arm64
          path: downloads

      - name: Publish runnable packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p releases
          rm -f releases/*
          cp downloads/tiktok-live-event-windows-x64.zip releases/
          cp downloads/tiktok-live-event-linux-x64.tar.gz releases/
          cp downloads/tiktok-live-event-linux-arm64.tar.gz releases/
          cp downloads/tiktok-live-event-termux-arm64.tar.gz releases/
          sha256sum releases/* > SHA256SUMS.txt

          cat > README.md <<'EOF'
          # TikTok LIVE Event — bản chạy sẵn

          Repo phân phối **Direct Webcast mode** đã đóng gói. Không cần `npm install` hoặc `pip install`, không dùng Chrome/DOM/Playwright.

          | Hệ | Gói | Chạy |
          |---|---|---|
          | Windows x64 | `releases/tiktok-live-event-windows-x64.zip` | Giải nén → `run.bat ten_tiktok` |
          | Linux x64 | `releases/tiktok-live-event-linux-x64.tar.gz` | Giải nén → `./run.sh ten_tiktok` |
          | Linux ARM64 | `releases/tiktok-live-event-linux-arm64.tar.gz` | Giải nén → `./run.sh ten_tiktok` |
          | Termux ARM64 | `releases/tiktok-live-event-termux-arm64.tar.gz` | Giải nén → `./run.sh ten_tiktok` |

          Có thể thêm API port ở tham số thứ hai, ví dụ `run.bat ten_tiktok 8788` hoặc `./run.sh ten_tiktok 8788`.

          **Windows/Linux:** Node và Python collector đã nằm trong gói, không cần cài runtime hay thư viện.

          **Termux ARM64:** toàn bộ thư viện Python (kể cả `pydantic-core` native Android) đã nằm trong gói nên không cần npm/pip. Do Node/Python của Termux phụ thuộc hệ Android và prefix của app, Termux cần có sẵn hai runtime cơ bản `node` và `python` (Python 3.14+). Không dùng gói Linux ARM64 trên Android.

          Hash SHA-256: xem `SHA256SUMS.txt`.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SHA256SUMS.txt releases/
          if git diff --cached --quiet; then
            echo 'Không có thay đổi để publish.'
          else
            git commit -m 'Add portable Windows, Linux and Termux builds'
            git push origin HEAD:main
          fi
