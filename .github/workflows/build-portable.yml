name: Build portable packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-portable.yml'
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-build
  cancel-in-progress: true

env:
  SOURCE_REPO: banupham/tiktok_live_cmd_active_viewers_v9
  SOURCE_REF: simplify-windows-linux-termux
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build direct collector EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-direct.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile `
            --name tiktok-direct-collector `
            --collect-all TikTokLive `
            --collect-all TikTokLiveProto `
            source/scripts/direct_webcast_collector.py
          .\dist\tiktok-direct-collector.exe --help | Out-Null

      - name: Assemble Windows portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle/app, bundle/runtime | Out-Null
          Copy-Item source/a.mjs bundle/app/a.mjs
          Copy-Item source/src bundle/app/src -Recurse
          python build/patch_portable.py bundle
          Copy-Item (Get-Command node).Source bundle/runtime/node.exe
          Copy-Item dist/tiktok-direct-collector.exe bundle/runtime/tiktok-direct-collector.exe
          @'
          @echo off
          chcp 65001 >nul
          setlocal
          cd /d "%~dp0"
          if "%~1"=="" (
            echo Cach dung: run.bat ten_tiktok [api_port]
            echo Vi du    : run.bat nhuquynh230794
            exit /b 1
          )
          if not "%~2"=="" set "API_PORT=%~2"
          if not defined API_PORT set "API_PORT=8787"
          set "COLLECTOR_MODE=direct"
          set "DIRECT_COLLECTOR_BIN=%~dp0runtime\tiktok-direct-collector.exe"
          "%~dp0runtime\node.exe" "%~dp0app\a.mjs" "%~1"
          exit /b %ERRORLEVEL%
          '@ | Set-Content -Encoding ASCII bundle/run.bat
          @'
          WINDOWS X64 PORTABLE
          - Khong can cai Node.js, Python, npm package hay pip package.
          - Chi co Direct Webcast mode; khong Chrome/DOM/Playwright.
          - Chay: run.bat ten_tiktok [api_port]
          - API mac dinh: http://127.0.0.1:8787
          '@ | Set-Content -Encoding UTF8 bundle/README.txt
          .\bundle\runtime\node.exe --check .\bundle\app\a.mjs
          if (Test-Path tiktok-live-event-windows-x64.zip) { Remove-Item tiktok-live-event-windows-x64.zip }
          Compress-Archive -Path bundle\* -DestinationPath tiktok-live-event-windows-x64.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64
          path: tiktok-live-event-windows-x64.zip
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and package Linux x64
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-direct.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile \
            --name tiktok-direct-collector \
            --collect-all TikTokLive \
            --collect-all TikTokLiveProto \
            source/scripts/direct_webcast_collector.py
          ./dist/tiktok-direct-collector --help >/dev/null
          mkdir -p bundle/app bundle/runtime
          cp source/a.mjs bundle/app/a.mjs
          cp -R source/src bundle/app/src
          python build/patch_portable.py bundle
          cp -L "$(command -v node)" bundle/runtime/node
          cp dist/tiktok-direct-collector bundle/runtime/tiktok-direct-collector
          cat > bundle/run.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          if [ "$#" -lt 1 ]; then
            echo "Cach dung: ./run.sh ten_tiktok [api_port]"
            exit 1
          fi
          USERNAME=$1
          if [ "${2:-}" != "" ]; then export API_PORT=$2; fi
          : "${API_PORT:=8787}"
          export API_PORT COLLECTOR_MODE=direct
          export DIRECT_COLLECTOR_BIN="$ROOT/runtime/tiktok-direct-collector"
          exec "$ROOT/runtime/node" "$ROOT/app/a.mjs" "$USERNAME"
          EOF
          chmod +x bundle/run.sh bundle/runtime/node bundle/runtime/tiktok-direct-collector
          cat > bundle/README.txt <<'EOF'
          LINUX X64 PORTABLE
          - Khong can cai Node.js, Python, npm package hay pip package.
          - Chi co Direct Webcast mode; khong Chrome/DOM/Playwright.
          - Chay: ./run.sh ten_tiktok [api_port]
          - API mac dinh: http://127.0.0.1:8787
          EOF
          bundle/runtime/node --check bundle/app/a.mjs
          tar -C bundle -czf tiktok-live-event-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-x64
          path: tiktok-live-event-linux-x64.tar.gz
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and package Linux ARM64
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "aarch64"
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-direct.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile \
            --name tiktok-direct-collector \
            --collect-all TikTokLive \
            --collect-all TikTokLiveProto \
            source/scripts/direct_webcast_collector.py
          ./dist/tiktok-direct-collector --help >/dev/null
          mkdir -p bundle/app bundle/runtime
          cp source/a.mjs bundle/app/a.mjs
          cp -R source/src bundle/app/src
          python build/patch_portable.py bundle
          cp -L "$(command -v node)" bundle/runtime/node
          cp dist/tiktok-direct-collector bundle/runtime/tiktok-direct-collector
          cat > bundle/run.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          if [ "$#" -lt 1 ]; then
            echo "Cach dung: ./run.sh ten_tiktok [api_port]"
            exit 1
          fi
          USERNAME=$1
          if [ "${2:-}" != "" ]; then export API_PORT=$2; fi
          : "${API_PORT:=8787}"
          export API_PORT COLLECTOR_MODE=direct
          export DIRECT_COLLECTOR_BIN="$ROOT/runtime/tiktok-direct-collector"
          exec "$ROOT/runtime/node" "$ROOT/app/a.mjs" "$USERNAME"
          EOF
          chmod +x bundle/run.sh bundle/runtime/node bundle/runtime/tiktok-direct-collector
          cat > bundle/README.txt <<'EOF'
          LINUX ARM64 PORTABLE
          - Khong can cai Node.js, Python, npm package hay pip package.
          - Chi co Direct Webcast mode; khong Chrome/DOM/Playwright.
          - Chay: ./run.sh ten_tiktok [api_port]
          - API mac dinh: http://127.0.0.1:8787
          EOF
          bundle/runtime/node --check bundle/app/a.mjs
          tar -C bundle -czf tiktok-live-event-linux-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-arm64
          path: tiktok-live-event-linux-arm64.tar.gz
          if-no-files-found: error

  termux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Vendor Python libraries for Termux
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/app bundle/vendor
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-direct.txt --target bundle/vendor
          find bundle/vendor -type f \( -name '*.so' -o -name '*.pyc' \) -delete
          find bundle/vendor -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          cp source/a.mjs bundle/app/a.mjs
          cp -R source/src bundle/app/src
          mkdir -p bundle/app/scripts
          cp source/scripts/direct_webcast_collector.py bundle/app/scripts/direct_webcast_collector.py
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python PYTHONPATH="$PWD/bundle/vendor" \
            python -c "from TikTokLive import TikTokLiveClient; print('TikTokLive pure-python import OK')"
          cat > bundle/run.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          if ! command -v node >/dev/null 2>&1; then
            echo "Thieu runtime Node.js cua Termux (lenh node)." >&2
            exit 10
          fi
          if ! command -v python >/dev/null 2>&1; then
            echo "Thieu runtime Python cua Termux (lenh python)." >&2
            exit 11
          fi
          if [ "$#" -lt 1 ]; then
            echo "Cach dung: ./run.sh ten_tiktok [api_port]"
            exit 1
          fi
          USERNAME=$1
          if [ "${2:-}" != "" ]; then export API_PORT=$2; fi
          : "${API_PORT:=8787}"
          export API_PORT COLLECTOR_MODE=direct
          export PYTHON_BIN=python
          export PYTHONPATH="$ROOT/vendor${PYTHONPATH:+:$PYTHONPATH}"
          export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
          exec node "$ROOT/app/a.mjs" "$USERNAME"
          EOF
          chmod +x bundle/run.sh
          cat > bundle/README.txt <<'EOF'
          TERMUX PORTABLE LIBRARIES
          - Khong can npm install / pip install.
          - Thu vien Python da nam trong vendor/.
          - Can Termux da co 2 runtime co ban: lenh node va python.
          - Android/Termux dung Bionic nen khong the dung binary Linux glibc.
          - Chay: ./run.sh ten_tiktok [api_port]
          EOF
          tar -C bundle -czf tiktok-live-event-termux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: portable-termux
          path: tiktok-live-event-termux.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows-x64, linux-x64, linux-arm64, termux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      - name: Download all portable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: downloads
          merge-multiple: true

      - name: Publish binaries into repo
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p releases
          cp downloads/* releases/
          sha256sum releases/* > SHA256SUMS.txt
          cat > README.md <<'EOF'
          # TikTok LIVE Event — bản chạy sẵn

          Repo này chỉ dùng để phân phối **Direct Webcast mode** đã đóng gói; không chứa flow cài npm/pip và không có Chrome/DOM/Playwright.

          ## Chọn bản

          | Hệ | File | Cài thư viện? | Cách chạy |
          |---|---|---|---|
          | Windows x64 | `releases/tiktok-live-event-windows-x64.zip` | Không cần Node/Python/npm/pip | Giải nén → `run.bat ten_tiktok` |
          | Linux x64 | `releases/tiktok-live-event-linux-x64.tar.gz` | Không cần Node/Python/npm/pip | Giải nén → `./run.sh ten_tiktok` |
          | Linux ARM64 | `releases/tiktok-live-event-linux-arm64.tar.gz` | Không cần Node/Python/npm/pip | Giải nén → `./run.sh ten_tiktok` |
          | Termux | `releases/tiktok-live-event-termux.tar.gz` | Không cần npm/pip; cần Termux đã có lệnh `node` + `python` | Giải nén → `./run.sh ten_tiktok` |

          Có thể truyền API port làm tham số thứ hai, ví dụ `run.bat ten_tiktok 8788` hoặc `./run.sh ten_tiktok 8788`.

          ## Vì sao Termux khác Linux?

          Termux chạy trên Android/Bionic, trong khi binary Linux thông thường dùng glibc. Vì vậy gói Termux đã vendor toàn bộ thư viện Python để **không cần `pip install`**, nhưng dùng runtime `node` và `python` của chính Termux. Không dùng file Linux ARM64 cho Termux.

          ## Kiểm tra file

          Hash SHA-256 nằm trong `SHA256SUMS.txt`.

          Nguồn middleware: `banupham/tiktok_live_cmd_active_viewers_v9`, nhánh `simplify-windows-linux-termux`.
          TikTokLive là thư viện không chính thức và protocol TikTok có thể thay đổi theo thời gian.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SHA256SUMS.txt releases/
          git commit -m "Add portable Windows, Linux and Termux builds"
          git push
